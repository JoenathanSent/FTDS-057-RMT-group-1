<svg viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inference banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1226"/>
      <stop offset="55%" stop-color="#131a3a"/>
      <stop offset="100%" stop-color="#1f1147"/>
    </linearGradient>

    <linearGradient id="historyLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="forecastLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="coneFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.03"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="360" fill="url(#grid)"/>
  <circle cx="1280" cy="90" r="260" fill="url(#glowSpot)"/>
  <circle cx="220" cy="300" r="220" fill="url(#glowSpot)"/>

  <!-- faint chip / circuit accents -->
  <g opacity="0.16" stroke="#93c5fd" stroke-width="1.5" fill="none">
    <rect x="90" y="60" width="46" height="46" rx="6"/>
    <line x1="113" y1="60" x2="113" y2="40"/>
    <line x1="113" y1="106" x2="113" y2="126"/>
    <line x1="90" y1="83" x2="70" y2="83"/>
    <line x1="136" y1="83" x2="156" y2="83"/>

    <rect x="1410" y="230" width="40" height="40" rx="6"/>
    <line x1="1430" y1="230" x2="1430" y2="212"/>
    <line x1="1430" y1="270" x2="1430" y2="288"/>
    <line x1="1410" y1="250" x2="1392" y2="250"/>
    <line x1="1450" y1="250" x2="1468" y2="250"/>
  </g>

  <!-- uncertainty cone for the forecast segment -->
  <path d="M 1000,182
           C 1120,150 1260,205 1480,120
           L 1480,260
           C 1260,300 1120,235 1000,220 Z"
        fill="url(#coneFill)"/>

  <!-- dashed split marker between history and forecast -->
  <line x1="1000" y1="70" x2="1000" y2="300" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- history price line -->
  <path d="M 90,230 C 180,250 250,190 330,205 S 460,140 540,165 S 660,120 740,140 S 880,190 1000,182"
        fill="none" stroke="url(#historyLine)" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- forecast dashed line (mean prediction) -->
  <path d="M 1000,182 C 1120,150 1260,205 1480,150"
        fill="none" stroke="url(#forecastLine)" stroke-width="4.5" stroke-linecap="round"
        stroke-dasharray="2 14" filter="url(#softGlow)"/>

  <!-- markers along history -->
  <g fill="#e0f2fe">
    <circle cx="330" cy="205" r="5"/>
    <circle cx="540" cy="165" r="5"/>
    <circle cx="740" cy="140" r="5"/>
    <circle cx="1000" cy="182" r="6.5" fill="#f8fafc"/>
  </g>

  <!-- forecast point marker at the end -->
  <circle cx="1480" cy="150" r="7" fill="#fde68a" filter="url(#softGlow)"/>
  <circle cx="1480" cy="150" r="12" fill="none" stroke="#fde68a" stroke-opacity="0.5" stroke-width="2"/>
</svg>
