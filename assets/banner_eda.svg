<svg viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Exploratory data analysis banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1226"/>
      <stop offset="55%" stop-color="#131a3a"/>
      <stop offset="100%" stop-color="#1f1147"/>
    </linearGradient>

    <linearGradient id="barFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="curveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="360" fill="url(#grid)"/>
  <circle cx="260" cy="90" r="240" fill="url(#glowSpot)"/>
  <circle cx="1380" cy="290" r="220" fill="url(#glowSpot)"/>

  <!-- faint chip / circuit accents -->
  <g opacity="0.16" stroke="#93c5fd" stroke-width="1.5" fill="none">
    <rect x="1440" y="55" width="42" height="42" rx="6"/>
    <line x1="1461" y1="55" x2="1461" y2="36"/>
    <line x1="1461" y1="97" x2="1461" y2="116"/>
    <line x1="1440" y1="76" x2="1420" y2="76"/>
    <line x1="1482" y1="76" x2="1502" y2="76"/>

    <rect x="70" y="250" width="38" height="38" rx="6"/>
    <line x1="89" y1="250" x2="89" y2="232"/>
    <line x1="89" y1="288" x2="89" y2="306"/>
    <line x1="70" y1="269" x2="52" y2="269"/>
    <line x1="108" y1="269" x2="126" y2="269"/>
  </g>

  <!-- bar chart cluster (left) -->
  <g>
    <rect x="150" y="230" width="46" height="80" rx="6" fill="url(#barFill)"/>
    <rect x="212" y="185" width="46" height="125" rx="6" fill="url(#barFill)"/>
    <rect x="274" y="245" width="46" height="65" rx="6" fill="url(#barFill)"/>
    <rect x="336" y="150" width="46" height="160" rx="6" fill="url(#barFill)"/>
    <rect x="398" y="205" width="46" height="105" rx="6" fill="url(#barFill)"/>
    <line x1="130" y1="312" x2="465" y2="312" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- scatter plot cluster (middle) -->
  <g filter="url(#softGlow)">
    <circle cx="640" cy="150" r="6" fill="#38bdf8"/>
    <circle cx="690" cy="190" r="5" fill="#fbbf24"/>
    <circle cx="720" cy="130" r="7" fill="#38bdf8"/>
    <circle cx="760" cy="205" r="5" fill="#38bdf8"/>
    <circle cx="800" cy="160" r="6" fill="#fbbf24"/>
    <circle cx="840" cy="220" r="5" fill="#38bdf8"/>
    <circle cx="870" cy="140" r="6" fill="#fbbf24"/>
    <circle cx="910" cy="185" r="5" fill="#38bdf8"/>
    <circle cx="950" cy="115" r="6" fill="#38bdf8"/>
  </g>
  <line x1="630" y1="235" x2="965" y2="105" stroke="#e2e8f0" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 10"/>

  <!-- distribution curve (right) -->
  <path d="M 1030,300
           C 1080,300 1090,300 1110,290
           C 1140,270 1150,150 1200,120
           C 1250,150 1260,270 1290,290
           C 1310,300 1320,300 1370,300 Z"
        fill="url(#curveFill)"/>
  <path d="M 1030,300
           C 1080,300 1090,300 1110,290
           C 1140,270 1150,150 1200,120
           C 1250,150 1260,270 1290,290
           C 1310,300 1320,300 1370,300"
        fill="none" stroke="url(#curveStroke)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
  <line x1="1030" y1="312" x2="1370" y2="312" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="2"/>
</svg>
